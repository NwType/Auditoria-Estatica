name: Auditoria Estatica
on: [push, pull_request]
jobs:
 audit:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v3
 - name: Setup .NET
 uses: actions/setup-dotnet@v3
 with:
 dotnet-version: '8.0.x'
 - name: Restore
 run: dotnet restore
 - name: Build with analyzers
 run: dotnet build --no-restore 
